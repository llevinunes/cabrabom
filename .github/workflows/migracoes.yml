# Applies new migrations to the Supabase Cloud database when they reach main (ADR 0043).
name: Migrações

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

# Never two pushes to the database at the same time; a queued run waits for the current one.
concurrency:
  group: migracoes
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  db-push:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Supabase CLI version pinned in package-lock.json, the same one used locally.
      - run: npm ci

      - name: Conferir segredos
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Segredo $name não configurado (Settings → Secrets and variables → Actions)."
              exit 1
            fi
          done

      - run: npx supabase link --project-ref "$SUPABASE_PROJECT_ID"

      # Only the migrations; the seed (example providers) never runs in production.
      - run: npx supabase db push --yes
